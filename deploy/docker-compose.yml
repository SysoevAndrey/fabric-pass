services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contributor_registry
      POSTGRES_USER: fabric_pass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Tuned down from Postgres's defaults, which assume a dedicated host —
    # this droplet has 1GB RAM shared with the app, Caddy, and the webhook
    # receiver, and the table this app writes is small by design.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=256MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=20
    volumes:
      - postgres_data:/var/lib/postgresql
    # Never publish this with `ports:` — Docker's own iptables rules can
    # bypass ufw, so the only thing keeping Postgres off the public internet
    # is that it's reachable exclusively over the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fabric_pass -d contributor_registry"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ghcr.io/constructorfabric/fabric-pass:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://fabric_pass:${POSTGRES_PASSWORD}@postgres:5432/contributor_registry
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # See the webhook service's mount below for why this is a directory
    # mount, not `./Caddyfile:/etc/caddy/Caddyfile:ro` — the same staleness
    # bug applies to any single bind-mounted file.
    command: ["caddy", "run", "--config", "/deploy/Caddyfile", "--adapter", "caddyfile"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/deploy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - webhook

  webhook:
    build: ./webhook
    restart: unless-stopped
    environment:
      DEPLOY_WEBHOOK_SECRET: ${DEPLOY_WEBHOOK_SECRET}
    # Docker-outside-of-Docker: this container drives the *host's* Docker
    # daemon over the mounted socket, which is root-equivalent host access.
    # That's what lets `pull`+`up -d` on the `app` service work from in here
    # — it's also why DEPLOY_WEBHOOK_SECRET must never leak; anyone who can
    # trigger this endpoint successfully can run arbitrary containers on the
    # host.
    #
    # `.:/deploy:ro` mounts the whole directory, not the individual files —
    # a single-file bind mount pins the container to that file's inode at
    # mount time. `sed -i` (and rsync, and most editors) replace a file via
    # write-new-then-rename rather than editing in place, which changes the
    # inode; a single-file mount then keeps showing the old, orphaned
    # content forever, invisibly, until the container itself restarts. A
    # directory mount doesn't have this failure mode — it was the actual
    # cause of production twice serving a webhook-triggered `app` container
    # built from a stale, incomplete `.env` after a `sed -i` edit, with the
    # file on disk already correct by the time anyone checked it.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/deploy:ro
    expose:
      - "9000"

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
